[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "rawflow"
version = "0.6.0"
description = "Evidence-gated non-destructive RAW editing"
requires-python = ">=3.11"
dependencies = ["numpy>=2,<3", "Pillow>=11,<13"]
license = "MIT"
[project.scripts]
rawflow = "rawflow.cli:main"
rawflow-gui = "rawflow.gui:main"
[tool.setuptools.packages.find]
include = ["rawflow*"]
